spring:
  application:
    name: contacore

  datasource:
    url: jdbc:postgresql://localhost:5432/contacore_db
    username: contacore_user
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

server:
  port: 8080

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-seconds: 3600
    issuer: contacore